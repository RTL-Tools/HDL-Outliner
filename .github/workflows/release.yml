# Push a tag like v0.1.2 to test, build, create the GitHub release and (if the VSCE_PAT secret is set) publish to the Marketplace.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npx --yes @vscode/vsce@4.1.0 package --skip-license
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" hdl-outliner-*.vsix --title "HDL Outliner $GITHUB_REF_NAME" --generate-notes
      - name: Publish to Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@4.1.0 publish --packagePath hdl-outliner-*.vsix
